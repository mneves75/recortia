# XcodeGen spec. Regenerate the committed project with `scripts/generate.sh` after editing.
name: Framepin
options:
  bundleIdPrefix: dev.mvneves
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: Q96FUTC5G8
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: Apple Development
    Release:
      CODE_SIGN_IDENTITY: Developer ID Application
packages:
  FramepinKit:
    path: Packages/FramepinKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
targets:
  Framepin:
    type: application
    platform: macOS
    sources:
      - path: FramepinApp
    info:
      path: FramepinApp/Info.plist
      properties:
        CFBundleDisplayName: Framepin
        CFBundleName: Framepin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Framepin contributors
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pt-BR]
    entitlements:
      path: FramepinApp/Framepin.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mvneves.Framepin
        PRODUCT_NAME: Framepin
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: FramepinKit
        product: Domain
      - package: FramepinKit
        product: Imaging
      - package: FramepinKit
        product: MacPlatform
      - package: KeyboardShortcuts
  FramepinUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FramepinUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mvneves.FramepinUITests
        TEST_TARGET_NAME: Framepin
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Framepin
      - package: FramepinKit
        product: FramepinFixtures
schemes:
  Framepin:
    build:
      targets:
        Framepin: all
        FramepinUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FramepinUITests
    archive:
      config: Release
