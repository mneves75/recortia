name: Bug report
description: Report incorrect behavior in Framepin.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** attach only synthetic images. Never attach real screenshots, OCR text,
        QR payloads, file paths, or window titles (THREAT_MODEL.md, "Disclosure through diagnostics").
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a synthetic PNG\n2. …"
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requirement or acceptance-test ID, if known
      placeholder: "FR-06 / RED-01"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version and build, Framepin version or commit, display configuration.
    validations:
      required: true
