name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: PR builds read the repository and nothing else (SPEC.md §12, REL-01).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      RECORTIA_TOOLCHAIN_MODE: stable
      # The hosted VM cannot run Vision text recognition; OCR recognition tests run in the local
      # gate, and a control test here fails if Vision starts working (OCRRecognitionTests.swift).
      RECORTIA_VISION_UNAVAILABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the stable Xcode named in TOOLCHAIN.json
        # The runner image's Xcode paths change; select by version and build, never by path.
        shell: bash
        run: |
          sw_vers
          baseline=$(python3 -c 'import json; b = json.load(open("TOOLCHAIN.json"))["stable_xcode_baseline"]; print(b["version"], b["build"])')
          read -r want_version want_build <<< "$baseline"
          selected=""
          available=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            if ! output=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>&1); then
              printf '%s: xcodebuild -version failed: %s\n' "$app" "$output"
              continue
            fi
            printf '%s:\n%s\n' "$app" "$output"
            version=$(awk '/^Xcode/ {print $2}' <<< "$output")
            build=$(awk '/Build version/ {print $3}' <<< "$output")
            available="$available ${version} (${build})"
            if [ -z "$selected" ] && [ "$version" = "$want_version" ] && [ "$build" = "$want_build" ]; then
              selected="$app"
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::no Xcode matches the stable baseline $want_version ($want_build) in TOOLCHAIN.json; available:${available:- none}"
            exit 1
          fi
          echo "selected $selected for $want_version ($want_build)"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
      - name: Fetch the pinned XcodeGen
        # scripts/xcodegen.sh downloads the version in TOOLCHAIN.json and verifies its sha256.
        run: scripts/xcodegen.sh --version
      - name: Gate
        run: scripts/check.sh --unsigned
