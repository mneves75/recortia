name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: PR builds read the repository and nothing else (SPEC.md §12, REL-01).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Preview image with Xcode 27.0 (27A266a) as default, matching TOOLCHAIN.json.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      # The hosted VM cannot run Vision text recognition; OCR recognition tests run in the local
      # gate, and a control test here fails if Vision starts working (OCRRecognitionTests.swift).
      RECORTIA_VISION_UNAVAILABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Gate
        run: scripts/check.sh --unsigned
