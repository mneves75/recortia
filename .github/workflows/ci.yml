name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: PR builds read the repository and nothing else (SPEC.md §12, REL-01).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      RECORTIA_TOOLCHAIN_MODE: stable
      # The hosted VM cannot run Vision text recognition; OCR recognition tests run in the local
      # gate, and a control test here fails if Vision starts working (OCRRecognitionTests.swift).
      RECORTIA_VISION_UNAVAILABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the stable Xcode named in TOOLCHAIN.json
        shell: bash
        run: |
          sw_vers
          developer_dir=$(scripts/select-xcode.sh)
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Fetch the pinned XcodeGen
        # scripts/xcodegen.sh downloads the version in TOOLCHAIN.json and verifies its sha256.
        run: scripts/xcodegen.sh --version
      - name: Gate
        run: scripts/check.sh --unsigned
